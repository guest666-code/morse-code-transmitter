<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Morse Code Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>> MORSE_TRANSMITTER_v1.0</h1>
    
    <div class="mode-header">
        <span id="mode-indicator" class="mode-badge">MODE: TEXT ➔ MORSE</span>
        <button id="btn-toggle-mode" class="btn-toggle">⇄ SWITCH DIRECTION</button>
    </div>

    <label for="input-text" id="label-input">ENTER TEXT:</label>
    <textarea id="input-text" placeholder="Type text here..."></textarea>

    <div class="controls">
        <div class="speed-control">
            <label for="wpm-slider">SPEED: <span id="wpm-value">15</span> WPM</label>
            <input type="range" id="wpm-slider" min="5" max="30" value="15">
        </div>
        <div class="button-group">
            <button id="btn-play">▶ PLAY MORSE</button>
            <button id="btn-stop" disabled>⏹ STOP</button>
        </div>
    </div>

    <label style="margin-top: 15px;" id="label-output">MORSE OUTPUT:</label>
    <div id="output-morse" class="output-box">...</div>

    <div class="footer">PURPLEGUY LABS // AUDIO SYNTHESIZER READY</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
